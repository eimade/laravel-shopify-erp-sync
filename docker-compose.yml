# Lancement : docker compose up -d --build   puis http://localhost:18080
# Les valeurs ci-dessous sont des valeurs de DÉMO (boutique Shopify simulée), pas des secrets.
x-app-env: &app-env
  APP_NAME: Uimad Sync
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://localhost:18080
  APP_LOCALE: fr
  LOG_CHANNEL: stderr
  DB_CONNECTION: mariadb
  DB_HOST: mariadb
  DB_PORT: 3306
  DB_DATABASE: uimadsync
  DB_USERNAME: uimadsync
  DB_PASSWORD: uimadsync-demo
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  MAIL_MAILER: log
  SHOPIFY_DRIVER: ${SHOPIFY_DRIVER:-fake}
  SHOPIFY_SHOP_DOMAIN: ${SHOPIFY_SHOP_DOMAIN:-uimadsync-demo.myshopify.com}
  SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN:-}
  SHOPIFY_LOCATION_ID: ${SHOPIFY_LOCATION_ID:-}
  SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET:-demo-webhook-secret}
  ERP_API_TOKEN: ${ERP_API_TOKEN:-demo-erp-token}
  UIMADSYNC_ALERT_EMAIL: ops@example.com

services:
  app:
    build: .
    image: uimadsync-app
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
    volumes:
      - keys:/var/www/keys
      - public:/var/www/public-shared
    depends_on:
      mariadb: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    image: uimadsync-app
    command: php artisan queue:work redis --sleep=1 --max-time=3600
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    volumes:
      - keys:/var/www/keys
    depends_on: [app]
    restart: unless-stopped

  scheduler:
    image: uimadsync-app
    command: php artisan schedule:work
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    volumes:
      - keys:/var/www/keys
    depends_on: [app]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "18080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
    depends_on: [app]
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: uimadsync
      MARIADB_USER: uimadsync
      MARIADB_PASSWORD: uimadsync-demo
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db:
  keys:
  public:
